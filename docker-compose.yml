# docker-compose.yml - Local development only (not for production deploys)
version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: sms_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sms_password}
      POSTGRES_DB: ${POSTGRES_DB:-school_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sms_backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://sms_user:sms_password@postgres:5432/school_management?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 5000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      SPARROW_SMS_API_KEY: mock
      SPARROW_SMS_SENDER_ID: SCHOOL
      SMS_MOCK_MODE: "true"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sms_frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
