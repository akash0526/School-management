# backend/render.yaml - Render deployment spec
services:
  - type: web
    name: sms-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SPARROW_SMS_API_KEY
        sync: false
      - key: SPARROW_SMS_SENDER_ID
        value: SCHOOL
      - key: SMS_MOCK_MODE
        value: "false"
